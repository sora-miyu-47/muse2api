version: '3.8'

services:
  muse2api:
    build: .
    image: muse2api:latest
    container_name: muse2api
    restart: always
    ports:
      - "127.0.0.1:18610:18610"
    environment:
      # 管理与 API 鉴权 Key（从 .env 或宿主环境读取，留空则自动生成）
      - MUSE2API_KEY=${MUSE2API_KEY:-}
      # 服务对外基准 URL，如 https://your-domain.com（留空则管理前端自动检测当前域名）
      - MUSE2API_PUBLIC_BASE=
      # 超时配置（秒）
      - MUSE2API_IMAGE_TIMEOUT=240
      - MUSE2API_VIDEO_TIMEOUT=600
      - MUSE2API_CHAT_TIMEOUT=300
      # 按 user 定向路由对话（详见 CHAT_USERS.md）
      - MUSE2API_CHAT_USER_ROUTING=${MUSE2API_CHAT_USER_ROUTING:-1}
      - MUSE2API_CHAT_USER_AUTO_BIND=${MUSE2API_CHAT_USER_AUTO_BIND:-1}
      - MUSE2API_CHAT_USER_EXCLUSIVE=${MUSE2API_CHAT_USER_EXCLUSIVE:-1}
      - MUSE2API_CHAT_USER_QUEUE_TIMEOUT=${MUSE2API_CHAT_USER_QUEUE_TIMEOUT:-120}
      # 审批卡自动处理（详见 README「审批卡自动批准」）；默认关闭
      - MUSE2API_AUTO_APPROVE=${MUSE2API_AUTO_APPROVE:-0}
      - MUSE2API_AUTO_APPROVE_DRY_RUN=${MUSE2API_AUTO_APPROVE_DRY_RUN:-}
      - MUSE2API_AUTO_APPROVE_ACCOUNTS=${MUSE2API_AUTO_APPROVE_ACCOUNTS:-}
      - MUSE2API_AUTO_APPROVE_BUILD=${MUSE2API_AUTO_APPROVE_BUILD:-}
    volumes:
      # 持久化账号配置、任务日志及媒体文件
      - ./data:/app/data
    shm_size: '2gb' # 保证 Chromium 渲染多标签页时不因 /dev/shm 耗尽崩溃
